:root{color-scheme:light dark}
text{font-family:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;fill:#B4B0A6;font-size:11px}
.cap{font-size:9.5px;letter-spacing:.16em;fill:#8D8B84}
.head{font-size:10px;letter-spacing:.18em;fill:#B4B0A6;font-weight:600}
.num{font-family:'DIN Alternate','DIN Condensed','Bahnschrift',ui-monospace,monospace;fill:#F1EEE6}
.ink{fill:#F1EEE6}
.dim{fill:#8D8B84}
.small{font-size:10px}
.hit{fill:transparent}
.hov:hover .lift{stroke:#8D8B84}

@keyframes rx-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes rx-pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes rx-rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes rx-ripple{from{transform:scale(1);opacity:.55}to{transform:scale(1.9);opacity:0}}
@keyframes rx-burst{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
@keyframes rx-ping{from{transform:scale(1);opacity:.7}to{transform:scale(2.6);opacity:0}}
@keyframes rx-fade{from{opacity:1}to{opacity:0}}
@keyframes rx-flash{from{opacity:1}to{opacity:0}}
@keyframes rx-breathe{from{opacity:.35}to{opacity:1}}
@keyframes rx-flow{to{stroke-dashoffset:-14}}
@keyframes rx-grow{from{transform:scaleX(var(--from,0))}to{transform:none}}
@keyframes rx-scan{from{transform:translateX(0)}to{transform:translateX(50%)}}
@keyframes rx-drift{to{transform:translateX(var(--drift,0px))}}
@keyframes rx-dash{from{stroke-dashoffset:var(--from,0)}}
.box{transform-box:fill-box;transform-origin:center}
.a-spin{transform:rotate(var(--rot,0deg));animation:rx-spin 60000ms linear infinite}
.a-orbit{animation:rx-spin 6000ms linear infinite;transform-box:fill-box;transform-origin:center}
.a-pop{animation:rx-pop 280ms cubic-bezier(.23,1,.32,1) both;transform-box:fill-box;transform-origin:center}
.a-rise{animation:rx-rise 240ms cubic-bezier(.23,1,.32,1) both}
.a-ripple{animation:rx-ripple 700ms cubic-bezier(.23,1,.32,1) both;transform-box:fill-box;transform-origin:center;opacity:0}
.a-burst{animation:rx-burst 900ms cubic-bezier(.23,1,.32,1) both;transform-box:fill-box;transform-origin:center;opacity:0}
.a-ping{animation:rx-ping 1600ms cubic-bezier(.23,1,.32,1) infinite;transform-box:fill-box;transform-origin:center;opacity:0}
.a-fade{animation:rx-fade 60000ms linear both}
.a-flash{animation:rx-flash 1200ms cubic-bezier(.23,1,.32,1) both;opacity:0}
.a-breathe{animation:rx-breathe 1200ms cubic-bezier(.77,0,.175,1) infinite alternate}
.a-flow{animation:rx-flow 800ms linear infinite}
.a-grow{animation:rx-grow 700ms cubic-bezier(.23,1,.32,1) both;transform-box:fill-box;transform-origin:left center}
.a-scan{animation:rx-scan 2400ms cubic-bezier(.77,0,.175,1) infinite;transform-box:fill-box}
.a-drift{animation:rx-drift 60000ms linear both}
.a-dash{animation:rx-dash 700ms cubic-bezier(.23,1,.32,1) both}
@media (prefers-reduced-motion:reduce){
.motion{display:none}
.a-spin,.a-orbit,.a-pop,.a-rise,.a-flow,.a-grow,.a-dash,.a-scan,.a-drift,.a-breathe{animation:none}
}
